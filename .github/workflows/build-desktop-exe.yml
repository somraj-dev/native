name: AxioVital Native — Desktop Executable Build & Artifacts

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  build-desktop-exe:
    name: Build & Package AxioVital.Desktop.exe
    runs-on: windows-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore NuGet Dependencies
        run: dotnet restore AxioVital.sln

      - name: Run Foundation Unit Tests
        run: dotnet run --project tests/AxioVital.UnitTests -c Release

      - name: Build, Package & Publish Desktop App via Proven Build Script
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File ./scripts/build-desktop.ps1 -Configuration Release -RuntimeId win-x64
          
          # Prepare distribution directory for GitHub artifact upload
          $distDir = "./dist/AxioVital-Desktop-win-x64"
          if (Test-Path $distDir) { Remove-Item $distDir -Recurse -Force }
          New-Item -ItemType Directory -Path $distDir -Force | Out-Null
          
          $publishSource = "axiovital-frontend/AxioVital.Desktop/bin/publish"
          Copy-Item "$publishSource/*" $distDir -Recurse -Force
          
          if (Test-Path "run-desktop.bat") { Copy-Item "run-desktop.bat" $distDir -Force }
          if (Test-Path "run-desktop.ps1") { Copy-Item "run-desktop.ps1" $distDir -Force }
          
          Write-Host "Artifact staging complete at $distDir"

      - name: Upload Desktop Executable Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AxioVital-Desktop-win-x64-v1.0
          path: ./dist/AxioVital-Desktop-win-x64/
          retention-days: 30
